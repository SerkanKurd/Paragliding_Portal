[project]
name = "paragliding-portal"
version = "0.3.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cookiecutter>=2.6.0",
    "django>=6.0.1",
    "django-htmx>=1.27.0",
    "django-tailwind[reload]>=4.4.2",
    "gunicorn>=25.0.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "psycopg[binary]>=3.3.2",
    "python-dotenv>=1.2.1",
]

[tool.ruff]
# Django projelerinde genellikle 88 veya 100 karakter idealdir
line-length = 100
target-version = "py312" # Python sürümüne göre güncelle (sen 3.14 kullanıyordun ama Ruff'ta en güncel stabil olanı seçebilirsin)

[tool.ruff.lint]
# Kullanılacak kütüphane kuralları
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (Import sıralama - Django için kritik)
    "B",   # flake8-bugbear
    "DJ",  # flake8-django (Django'ya özel kurallar!)
]

ignore = [
    "E501", # Satır uzunluğu hatalarını yoksay (bazen HTML/URL'lerde kaçınılmaz)
]

[tool.ruff.lint.per-file-ignores]
# Migration dosyalarında linter kurallarını esnet
"**/migrations/*" = ["E501", "N806"]
# Settings dosyasında gizli anahtarlar veya uzun listeler olabilir
"settings.py" = ["F401", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]

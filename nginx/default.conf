# Cloudflare HTTPS'i sonlandırıp X-Forwarded-Proto: https gönderir.
# Başlık yoksa (ör. doğrudan erişim) nginx'in kendi şemasını kullan.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Gerçek ziyaretçi IP'si: Cloudflare Tunnel'dan gelen istekte CF-Connecting-IP,
# yoksa bağlantının kendi adresi.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# --- İstek sınırlama (brute-force / kötüye kullanım koruması) ---
# Yalnızca ilgili POST istekleri sayılır; anahtar boşsa nginx o isteği sınırlamaz.
map "$request_method:$uri" $auth_limit_key {
    "~^POST:.*/login/$" $client_ip;   # site girişi ve admin girişi
    "POST:/signup/"     $client_ip;
    default             "";
}

map "$request_method:$uri" $upload_limit_key {
    "POST:/igc_converter/"     $client_ip;
    "POST:/flight_visualizer/" $client_ip;
    default                    "";
}

limit_req_zone $auth_limit_key   zone=auth:10m   rate=5r/m;
limit_req_zone $upload_limit_key zone=upload:10m rate=10r/m;
limit_req_status 429;

upstream web_app {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location /static/ {
        alias /app/staticfiles/;
        add_header Cache-Control "no-cache";
    }

    location /media/ {
        alias /app/mediafiles/;
    }

    location / {
        # Giriş/kayıt: dakikada 5 POST (+5 ani istek payı); upload: dakikada 10 (+5)
        limit_req zone=auth burst=5 nodelay;
        limit_req zone=upload burst=5 nodelay;

        proxy_pass http://web_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_redirect off;
        client_max_body_size 11M; # IGC limiti 10 MB + multipart payı
    }
}
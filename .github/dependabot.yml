# Bağımlılık güncellemeleri: haftada bir, küçük/yama güncellemeleri tek PR'da toplanır.
# Güvenlik güncellemeleri bu takvimden bağımsız olarak hemen açılır
# (GitHub → Settings → Code security → Dependabot security updates açık olmalı).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/theme/static_src"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

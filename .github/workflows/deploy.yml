name: Continuous Integration & Deployment

on:
  push:
    branches: [ "main" ] # Main branch'ine kod gönderildiğinde çalışır
  pull_request:
    branches: [ "main" ]

# Varsayılan olarak en az yetki; ihtiyaç duyan job kendi yetkisini ister.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # Otomatik olarak 'kullanici_adi/repo_adi' olur

jobs:
  test:
    name: Test, lint ve güvenlik kontrolleri
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Kodları Çek (Checkout)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 🐍 uv Kurulumu
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true

      - name: 📦 Bağımlılıkları Kur
        run: uv sync --frozen

      - name: 🧹 Lint (ruff)
        run: uv run ruff check .

      - name: 🧪 Testler
        run: uv run python manage.py test

      - name: 🔒 Django Deploy Kontrolü
        run: |
          SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            uv run python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: example.com

      - name: 🛡️ Bağımlılık Güvenlik Taraması (pip-audit)
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  build-and-push:
    needs: test # Testler geçmeden imaj derlenmez
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR'a imaj yazabilmek için gerekli yetki

    steps:
      - name: 🚀 Kodları Çek (Checkout)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 🟢 Node.js Kurulumu
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'theme/static_src/package-lock.json'

      - name: 🎨 Tailwind CSS Bağımlılıklarını Kur ve Derle
        run: |
          cd theme/static_src/
          npm ci
          npm run build
          cd ../..

      - name: 🐳 Docker Buildx Kurulumu (Gelişmiş Önbellekleme İçin)
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: 🔑 GitHub Container Registry'ye Giriş Yap
        if: github.event_name == 'push' # PR'larda imaj gönderilmez, girişe gerek yok
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub bunu otomatik tanımlar, ekstra ayar gerekmez

      - name: 🏷️ Docker İmaj Etiketlerini ve Metadata'yı Ayarla
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # PR'larda imaj yalnızca derlenir (Dockerfile doğrulanır), GHCR'a gönderilmez.
      - name: 📦 Docker İmajını Derle (main'de GHCR'a Gönder)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./dockerfile # Eğer Dockerfile'ın farklı bir yerdeyse burayı düzenleyebilirsin
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

name: Continuous Integration & Deployment

on:
  push:
    branches: [ "main" ] # Main branch'ine kod gönderildiğinde çalışır
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # Otomatik olarak 'kullanici_adi/repo_adi' olur

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR'a imaj yazabilmek için gerekli yetki

    steps:
      - name: 🚀 Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: 🟢 Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-size: '20'
          cache: 'npm'
          cache-dependency-path: 'theme/static_src/package-lock.json'

      - name: 🎨 Tailwind CSS Bağımlılıklarını Kur ve Derle
        run: |
          cd theme/static_src/
          npm ci
          npm run build
          cd ../..

      - name: 🐳 Docker Buildx Kurulumu (Gelişmiş Önbellekleme İçin)
        uses: docker/setup-buildx-action@v3

      - name: 🔑 GitHub Container Registry'ye Giriş Yap
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub bunu otomatik tanımlar, ekstra ayar gerekmez

      - name: 🏷️ Docker İmaj Etiketlerini ve Metadata'yı Ayarla
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 📦 Docker İmajını Derle ve GHCR'a Gönder (Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile # Eğer Dockerfile'ın farklı bir yerdeyse burayı düzenleyebilirsin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
